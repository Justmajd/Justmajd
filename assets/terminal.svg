<svg xmlns="http://www.w3.org/2000/svg" width="960" height="410" viewBox="0 0 960 410" role="img" aria-labelledby="title desc">
  <title id="title">Majd's terminal profile</title>
  <desc id="desc">A dark terminal window introducing Majd as a developer.</desc>
  <rect width="960" height="410" rx="18" fill="#0d1117"/>
  <rect x="1" y="1" width="958" height="408" rx="17" fill="none" stroke="#30363d" stroke-width="2"/>
  <path d="M18 58h924" stroke="#30363d" stroke-width="2"/>
  <circle cx="34" cy="30" r="7" fill="#ff5f57"/>
  <circle cx="58" cy="30" r="7" fill="#febc2e"/>
  <circle cx="82" cy="30" r="7" fill="#28c840"/>
  <text x="480" y="36" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" text-anchor="middle">majd@github — profile</text>
  <text x="42" y="102" fill="#39ff88" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">$ whoami</text>
