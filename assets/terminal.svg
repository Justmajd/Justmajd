  <text x="180" y="220" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">JavaScript · TypeScript · CSS</text>
  <text x="42" y="250" fill="#ff4fd8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">GAME DEV</text>
  <text x="180" y="250" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">Unity · Godot · GDScript</text>
  <text x="42" y="280" fill="#ffbc4a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">SYSTEMS</text>
  <text x="180" y="280" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">C · C++ · C# · Shell</text>
